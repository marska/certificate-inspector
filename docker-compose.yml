services:
  certificate-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    # Swap the build above for the published image to run without a checkout:
    #   image: ${DOCKERHUB_IMAGE:-certificate-inspector}:latest
    image: certificate-inspector:local
    container_name: certificate-inspector
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped

    # The container serves static files and nothing else. None of the following
    # costs the app anything, because there is no runtime to take them away
    # from — no application server, no writes, no outbound calls.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      # nginx needs somewhere for its pid file and request buffers. Both are
      # world-writable because nginx runs as UID 101 and creates its own temp
      # directories under /var/cache/nginx at startup.
      - /tmp:mode=1777,size=16m
      - /var/cache/nginx:mode=1777,size=16m

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
