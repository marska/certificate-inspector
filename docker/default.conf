# Certificate Inspector — static site server.
#
# The image contains no application runtime: nginx serves pre-rendered HTML and
# JavaScript, and every certificate is parsed in the visitor's browser. There is
# no endpoint here that could receive one.

server {
    # 8080, not 80: the nginx-unprivileged base image runs as a non-root user
    # and cannot bind a privileged port.
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not advertise the exact nginx version.
    server_tokens off;

    # Certificates pasted into the page are large; requests to this server never
    # are — nothing is ever uploaded.
    client_max_body_size 16k;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;

    # Only GET/HEAD make sense against a static site.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    include /etc/nginx/snippets/security-headers.conf;

    # Container/orchestrator probe, kept out of the access log so health checks
    # do not drown the real traffic.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed build assets never change under the same name.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # HTML is revalidated every time, otherwise a deployed fix would never reach
    # anyone holding a cached copy.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        # `=404` rather than a `/404.html` fallback: falling back to the file
        # directly would serve the not-found page with a 200 status. Routing it
        # through error_page keeps the status honest.
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }
}
