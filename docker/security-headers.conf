# Included by every location block in default.conf.
#
# nginx's add_header does not merge: a location that sets any header of its own
# discards every header inherited from the server block. Keeping these in one
# snippet and including it per location is what stops a Cache-Control line from
# quietly switching the CSP off.
#
# connect-src 'none' is the load-bearing one. It forbids fetch, XHR, WebSocket,
# EventSource and sendBeacon outright, so even a compromised dependency could
# not send a pasted certificate anywhere. The app never makes a network request
# after load, so nothing legitimate is lost.
#
# 'unsafe-inline' for scripts is unavoidable in a static export: there is no
# server to mint a per-request nonce, and both the theme bootstrap and Next's
# hydration bootstrap are inline. With no server, no user-supplied HTML and no
# third-party origin in the page, the residual exposure is small.

add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options       "nosniff" always;
add_header X-Frame-Options              "DENY" always;
add_header Referrer-Policy              "no-referrer" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy           "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
